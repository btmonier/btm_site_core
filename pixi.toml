[workspace]
name = "Site Actions"
channels = ["conda-forge"]
platforms = ["linux-64", "osx-64", "osx-arm64", "win-64"]

[dependencies]
# R itself
r = ">=4.3,<5"

# R packages from conda-forge (names are prefixed with r-)
r-jsonlite  = "*"
r-dplyr     = "*"
r-rvest     = "*"
r-httr      = "*"

[tasks]
metrics = "Rscript scripts/scrape_gs_metrics.R"
ghcont  = "Rscript scripts/scrape_github_contributions.R"
cv      = { cmd = "./gradlew jvmRun --args='-o {{ output }}'", args = [{ arg = "output", default = "btmonier_cv.pdf" }] }
website = "./gradlew jsBrowserDevelopmentRun --continuous"
